<!-- Scroll to Top Button -->
<button
  mat-fab
  color="primary"
  *ngIf="showScrollTop"
  (click)="scrollToTop()"
  class="fixed bottom-6 right-6 bg-[#c5a751] hover:bg-[#d8c48a] text-white shadow-lg transition-all duration-300 z-50 rounded-full my-custom-fab cursor-pointer"
  [@fadeInOut]
  aria-label="Scroll to top"
>
  <mat-icon>arrow_upward</mat-icon>
</button>
