<div class="p-6 sm:p-8 max-w-2xl mx-auto bg-white text-[#334d42] rounded-xl shadow-lg overflow-y-auto max-h-[80vh] sm:max-h-[80vh] md:max-h-[85vh] lg:max-h-[90vh]">
  <!-- Close Button (Top Right) -->
  <button class="absolute top-4 right-4 text-[#334d42] hover:text-[#c5a751] focus:outline-none transition-colors duration-300 sm:top-4 sm:right-4 md:top-6 md:right-6 w-6 h-6 sm:w-6 sm:h-6 md:w-7 md:h-7" aria-label="Close modal">
    <svg class="w-6 h-6 sm:w-6 sm:h-6 md:w-7 md:h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>

  <!-- Profile Card -->
  <div class="flex flex-col sm:flex-row items-center gap-6 sm:gap-10 md:gap-12">
    <!-- Image -->
    <div class="w-40 h-40 sm:w-48 sm:h-48 md:w-56 md:h-56 rounded-full overflow-hidden border-4 border-[#c5a751] shadow-md xs:w-32 xs:h-32">
      @if (data.image) {
        <img
          [src]="data.image"
          [alt]="data.name"
          class="w-full h-full object-cover transition-transform duration-300 hover:scale-105 sm:w-full sm:h-full md:w-full md:h-full xs:w-full xs:h-full"
        />
      } @else {
        <div class="w-40 h-40 sm:w-48 sm:h-48 md:w-56 md:h-56 flex items-center justify-center bg-white text-gray-700 xs:w-32 xs:h-32">
          <span class="text-3xl font-bold sm:text-4xl md:text-5xl xs:text-2xl">{{ data.name.charAt(0) }}</span>
        </div>
      }
    </div>

    <!-- Details -->
    <div class="flex-1 text-center sm:text-left md:text-left">
      <h3 class="text-2xl sm:text-3xl md:text-4xl font-semibold mb-2 text-[#334d42] xs:text-xl">{{ data.name }}</h3>
      <p class="text-lg text-[#c5a751] uppercase mb-2 sm:text-lg md:text-xl xs:text-base">{{ data.position }}</p>
      <p class="text-md text-[#334d42] mb-4 sm:text-lg md:text-xl xs:text-sm">{{ data.department }}</p>
      <p class="text-gray-700 leading-relaxed mb-6 sm:text-base md:text-lg xs:text-sm">{{ data.description }}</p>

      <!-- Social Links -->
      <!-- <div class="flex justify-center sm:justify-start md:justify-start gap-4 sm:gap-4 md:gap-5">
        @if (data.social.linkedin) {
          <a
            href="{{ data.social.linkedin }}"
            target="_blank"
            class="text-white hover:text-[#c5a751] transition-colors duration-300 sm:text-white md:text-white"
            aria-label="LinkedIn"
          >
            <i class="fab fa-linkedin-in text-2xl sm:text-2xl md:text-3xl xs:text-xl"></i>
          </a>
        }
        @if (data.social.email) {
          <a
            href="mailto:{{ data.social.email }}"
            class="text-white hover:text-[#c5a751] transition-colors duration-300 sm:text-white md:text-white"
            aria-label="Email"
          >
            <i class="fas fa-envelope text-2xl sm:text-2xl md:text-3xl xs:text-xl"></i>
          </a>
        }
      </div> -->
    </div>
  </div>

  <div class="flex justify-center sm:justify-end p-4 sm:p-4 md:p-6">
    <button (click)="closeModal()" class="cursor-pointer px-6 py-2 bg-[#c5a751] hover:bg-[#d8c48a] text-white rounded-md transition-all duration-300 sm:px-6 sm:py-2 md:px-8 md:py-3 xs:px-4 xs:py-1">
      Close
    </button>
  </div>
</div>
