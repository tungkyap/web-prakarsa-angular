<!-- shared/components/modal/modal.component.html -->
@if (isVisible()) {
  <div
    [class]="backdropClass()"
    (click)="onBackdropClick($event)"
    (keypress)="onBackdropClick($event)"
    aria-modal="true"
    [attr.aria-labelledby]="config().showHeader ? 'modal-title' : null">

    <div [class]="modalClass()"
        (click)="stopPropagation($event)" (keypress)="stopPropagation($event)">

      <!-- Modal Header -->
      @if (config().showHeader) {
        <div class="flex items-center justify-between p-6 border-b bg-gradient-to-r from-[#334d42] to-[#456d5a] text-white rounded-t-2xl"
            [class]="config().headerClass">
          <div class="flex-1">
            <ng-content select="[slot=header]">
              <h2 id="modal-title" class="text-2xl font-bold">{{ title() }}</h2>
            </ng-content>
          </div>

          @if (config().closable) {
            <button (click)="handleClose()"
                    class="p-2 hover:bg-white/20 rounded-full transition-colors duration-200 ml-4"
                    aria-label="Close modal"
                    type="button">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
              </svg>
            </button>
          }
        </div>
      }

      <!-- Modal Body -->
      <div class="overflow-y-auto max-h-[calc(90vh-160px)]"
          [class]="config().bodyClass">
        <ng-content select="[slot=body]">
          <div class="p-6">
            <ng-content></ng-content>
          </div>
        </ng-content>
      </div>

      <!-- Modal Footer -->
      @if (config().showFooter) {
        <div class="flex justify-end gap-3 p-6 border-t bg-gray-50 rounded-b-2xl"
             [class]="config().footerClass">
          <ng-content select="[slot=footer]">
            <button (click)="handleClose()"
                    class="px-6 py-2 bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold rounded-lg transition-colors duration-200"
                    type="button">
              Close
            </button>
          </ng-content>
        </div>
      }
    </div>
  </div>
}
