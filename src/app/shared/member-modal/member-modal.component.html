  <!-- Member Photo -->
  <div class="bg-gradient-to-br from-[#334d42] to-[#4a6b5a] p-8 text-center relative">
    <div class="inline-block relative">
      <img
        [src]="member.image"
        [alt]="member.name"
        class="w-40 h-40 rounded-full object-cover border-6 border-[#c5a751] shadow-lg transition-transform duration-300 hover:scale-105 sm:w-48 sm:h-48 md:w-60 md:h-60 lg:w-64 lg:h-64 xs:w-32 xs:h-32"
        loading="lazy">
    </div>
  </div>

  <!-- Member Information -->
  <div class="p-8 flex-1 sm:p-8 md:p-8 lg:p-8 xs:p-6">
    <div class="text-center mb-8 border-b border-gray-200 pb-6 sm:text-center md:text-center lg:text-center xs:text-center">
      <h2 class="text-3xl font-bold text-[#334d42] mb-2 leading-tight sm:text-3xl md:text-4xl lg:text-4xl xs:text-2xl">{{ member.name }}</h2>
      <p class="text-lg font-semibold text-[#c5a751] mb-1 uppercase tracking-wide sm:text-lg md:text-lg lg:text-lg xs:text-base">{{ member.department }}</p>
      <p class="text-base text-gray-500 italic sm:text-base md:text-base lg:text-base xs:text-sm">{{ member.position }}</p>
    </div>

    <div class="mb-8 sm:mb-8 md:mb-8 lg:mb-8 xs:mb-6">
      <h3 class="text-xl font-semibold text-[#334d42] mb-4 flex items-center sm:text-xl md:text-xl lg:text-xl xs:text-lg">
        <span class="w-1 h-5 bg-[#c5a751] mr-3 rounded"></span>About
      </h3>
      <p class="text-base leading-loose text-gray-600 text-justify sm:text-base md:text-base lg:text-base xs:text-sm">{{ member.description }}</p>
    </div>

    <!-- Social Links -->

    <div class="flex justify-center gap-3 pt-6 border-t border-gray-200 sm:justify-start">
      <button
        color="primary"
        class="px-8 py-3 bg-[#334d42] text-white rounded-lg font-semibold hover:bg-[#c5a751] hover:translate-y-[-0.25rem] transition-all duration-300 sm:px-8 sm:py-3 md:px-8 md:py-3 lg:px-8 lg:py-3 xs:px-6 xs:py-2"
