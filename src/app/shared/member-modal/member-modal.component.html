  <!-- Member Photo -->
  <div class="member-photo-section">
    <div class="photo-container">
      <img
        [src]="member.image"
        [alt]="member.name"
        class="member-photo"
        loading="lazy">
    </div>
  </div>

  <!-- Member Information -->
  <div class="member-info-section">
    <div class="member-header">
      <h2 class="member-name">{{ member.name }}</h2>
      <p class="member-department">{{ member.department }}</p>
      <p class="member-position">{{ member.position }}</p>
    </div>

    <div class="member-description">
      <h3 class="description-title">About</h3>
      <p class="description-text">{{ member.description }}</p>
    </div>

    <!-- Action Buttons -->
    <div class="action-buttons">
      <button
        mat-raised-button
